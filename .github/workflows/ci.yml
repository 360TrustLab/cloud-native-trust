name: Verify conference lab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-15
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, verified 2026-10-15
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python lab.py --output artifacts/report.json
      - name: Validate CloudFormation without deploying
        run: |
          python -m pip install cfn-lint==1.46.0
          cfn-lint infra/stack.json
